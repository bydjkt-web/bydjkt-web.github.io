name: Build website

# Otomatis membangun ulang folder docs/ setiap kali isi src/ atau tools/ berubah
# (mis. Anda edit site.json atau tambah artikel .md lewat aplikasi GitHub di HP).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
  workflow_dispatch:   # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install pillow

      - name: Build website
        run: python tools/build.py

      - name: Cek SEO (gagal = tidak dipublish)
        run: python tools/seo_check.py

      - name: Commit hasil build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada docs/"
          else
            git commit -m "Build otomatis website"
            git push
          fi
          
